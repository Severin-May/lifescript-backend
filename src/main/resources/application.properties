# Browser origins allowed to call /api directly (comma-separated). Not needed when a proxy serves
# the frontend and /api from the same address, as the Vite dev server does.
# Override without code changes, with the environment variable LIFESCRIPT_CORS_ALLOWEDORIGINS (dots become _, dashes are dropped).
lifescript.cors.allowed-origins=http://localhost:5173

# The database from docker-compose.yml. Override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/lifescript
spring.datasource.username=lifescript
spring.datasource.password=lifescript
# Flyway creates and changes the tables (src/main/resources/db/migration); Hibernate only checks
# that the Java classes match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Every error response uses the standard ProblemDetail JSON ({"status", "title", "detail", ...}).
spring.mvc.problemdetails.enabled=true

# The login session cookie is only sent with requests from this site's own pages.
server.servlet.session.cookie.same-site=lax

# The default scheduler (a compile request may pick another): greedy (milliseconds), csp (searches all tasks at once) or hybrid
# (greedy's schedule improved by csp). time-limit is how long csp and hybrid may search; they return
# the best schedule found by then. Override with LIFESCRIPT_SCHEDULER_ALGORITHM and LIFESCRIPT_SCHEDULER_TIMELIMIT.
lifescript.scheduler.algorithm=greedy
lifescript.scheduler.time-limit=2s
